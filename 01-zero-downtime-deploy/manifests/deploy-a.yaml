# A: 안전하지 않은 설정 (preStop 없음, SIGTERM 즉시 종료, 유예시간 기본값)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      # terminationGracePeriodSeconds: 기본값(30초) 사용
      containers:
        - name: web
          image: fastapi-graceful:1
          imagePullPolicy: IfNotPresent
          env:
            - {name: MODE, value: "A"}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 8000