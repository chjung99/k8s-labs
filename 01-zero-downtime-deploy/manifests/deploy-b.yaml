# B: 안전한 설정 (preStop sleep + graceful shutdown + 넉넉한 유예시간)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: web
          image: fastapi-graceful:1
          imagePullPolicy: IfNotPresent
          env:
            - {name: MODE, value: "B"}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 2
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "12"]
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 8000